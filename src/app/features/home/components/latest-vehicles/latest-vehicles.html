<section class="latest-section"><div class="container">
  <div class="section-heading"><h2>Recently Missing Vehicles</h2><a routerLink="/search">View All <span>→</span></a></div>
  <div class="vehicle-grid">@for(vehicle of vehicles;track vehicle.number){
    <article class="vehicle-card"><img [src]="vehicle.image" [alt]="vehicle.brand"><div class="vehicle-info"><h3>{{vehicle.number}}</h3><p>{{vehicle.brand}}</p><div class="details"><span><mat-icon>location_on</mat-icon>{{vehicle.location}}</span><span><mat-icon>calendar_today</mat-icon>{{vehicle.date}}</span></div><b>Reward: <em>{{vehicle.reward}}</em></b></div><div class="vehicle-status"><span>MISSING</span><button aria-label="View vehicle"><mat-icon>chevron_right</mat-icon></button></div><a class="view-details" routerLink="/search">View Details</a></article>
  }</div></div></section>
