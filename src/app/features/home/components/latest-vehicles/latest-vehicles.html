<section class="latest-section"><div class="container">
  <div class="section-heading"><div><span class="eyebrow">Active alerts</span><h2>Recently Missing Vehicles</h2></div><a routerLink="/search">View all <mat-icon>arrow_forward</mat-icon></a></div>
  <div class="vehicle-grid">@for(vehicle of vehicles;track vehicle.number){
    <article class="vehicle-card"><div class="vehicle-image"><img [src]="vehicle.image" [alt]="vehicle.brand"><span class="vehicle-status">Missing</span></div><div class="vehicle-info"><div class="vehicle-title"><div><h3>{{vehicle.number}}</h3><p>{{vehicle.brand}}</p></div><button aria-label="View vehicle" routerLink="/search"><mat-icon>arrow_outward</mat-icon></button></div><div class="details"><span><mat-icon>location_on</mat-icon>{{vehicle.location}}</span><span><mat-icon>calendar_today</mat-icon>{{vehicle.date}}</span></div><b>Reward <em>{{vehicle.reward}}</em></b></div><a class="view-details" routerLink="/search">View details</a></article>
  }</div></div></section>
