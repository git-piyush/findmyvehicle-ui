[build]
  command = "npm run build"
  publish = "dist/findmyvehicle-ui/browser"

[[redirects]]
  from = "/api/*"
  to = "https://findmyvehicle.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "https://findmyvehicle.onrender.com/oauth2/:splat"
  status = 200
  force = true

# Keep Angular client-side routes working after the API and OAuth proxy rules
# have had a chance to match.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
